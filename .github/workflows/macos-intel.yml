
name: Build Mixar Intel macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-intel:
    name: Build Intel DMG
    runs-on: macos-15-intel
    timeout-minutes: 360

    env:
      MIXAR_ENV: Prod
      BUILD_CORES: "3"
      MIXAR_CUDA: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify native Intel toolchain
        run: |
          uname -m
          test "$(uname -m)" = "x86_64"
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          df -h /

      - name: Initialize Blender dependencies
        run: make init

      - name: Check available disk
        run: df -h /

      - name: Build Mixar
        run: make build

      - name: Package macOS DMG
        run: cmake --build build/Prod --target package --config Release

      - name: Inspect package
        run: |
          find build/Prod -type f -name '*.dmg' -print
          df -h /

      - name: Upload Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: Mixar-Intel-macOS
          path: build/Prod/*.dmg
          if-no-files-found: error
          retention-days: 7
