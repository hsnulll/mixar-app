name: Build Mixar Intel macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-intel:
    name: Build Intel DMG
    runs-on: macos-15-intel
    timeout-minutes: 360

    env:
      MIXAR_ENV: Prod
      BUILD_CORES: "3"
      MIXAR_CUDA: "0"
      BLENDER_SRC: ${{ github.workspace }}/upstream
      INTEL_LIBDIR: ${{ github.workspace }}/lib-macos-x64
      GH_TOKEN: ${{ github.token }}
      INTEL_DEPS_REPO: lastowl/intel-blender-5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Verify native Intel toolchain
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          sw_vers
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          df -h /

      - name: Initialize pinned Blender source
        run: make init

      # The fetched release is already built from this exact Blender
      # dependency manifest with the reference project's dependency fixes.
      # No source patch is applied here: the optional EEVEE workaround is a
      # runtime behavior change, not a prerequisite for producing a DMG.

      - name: Fetch matching Intel dependency stack
        env:
          DEPS_INSTALL_DIR: ${{ github.workspace }}/lib-macos-x64
          REPO: ${{ env.INTEL_DEPS_REPO }}
        run: ./scripts/intel/fetch-deps.sh

      - name: Verify dependency architecture
        run: |
          set -euo pipefail
          test -d "$INTEL_LIBDIR"
          test -e "$INTEL_LIBDIR/.git"
          matches=0
          while IFS= read -r -d '' item; do
            details="$(file -b "$item")"
            case "$details" in
              *Mach-O*)
                echo "$details"
                echo "$details" | grep -q 'x86_64' || {
                  echo "non-Intel dependency: $item ($details)" >&2
                  exit 1
                }
                matches=$((matches + 1))
                ;;
            esac
          done < <(find "$INTEL_LIBDIR" -type f \( -name '*.dylib' -o -name '*.a' \) -print0)
          test "$matches" -gt 0

      - name: Build Mixar
        env:
          LIBDIR: ${{ github.workspace }}/lib-macos-x64
        run: make build

      - name: Validate Intel Mixar.app
        run: |
          set -euo pipefail
          app="$GITHUB_WORKSPACE/build/Prod/bin/Mixar.app"
          executable="$app/Contents/MacOS/Mixar"
          test -d "$app"
          test -x "$executable"
          test "$(lipo -archs "$executable")" = "x86_64"
          file "$executable" | grep -q 'x86_64'
          machos=0
          while IFS= read -r -d '' item; do
            details="$(file -b "$item")"
            case "$details" in
              *Mach-O*)
                echo "$details"
                echo "$details" | grep -q 'x86_64' || {
                  echo "non-Intel bundle binary: $item ($details)" >&2
                  exit 1
                }
                machos=$((machos + 1))
                ;;
            esac
          done < <(find "$app" -type f -print0)
          test "$machos" -gt 0

      - name: Package macOS DMG
        run: cmake --build build/Prod --target package --config Release

      - name: Verify non-empty DMG
        run: |
          set -euo pipefail
          dmg="$(find "$GITHUB_WORKSPACE/build/Prod" -type f -name '*.dmg' -size +0c -print -quit)"
          test -n "$dmg"
          echo "MIXAR_DMG=$dmg" >> "$GITHUB_ENV"
          ls -lh "$dmg"
          df -h /

      - name: Upload Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: Mixar-Intel-macOS
          path: ${{ env.MIXAR_DMG }}
          if-no-files-found: error
          retention-days: 7
