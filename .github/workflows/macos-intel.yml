name: Build Mixar Intel macOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-intel:
    name: Build Intel DMG
    runs-on: macos-15-intel
    timeout-minutes: 360

    env:
      MIXAR_ENV: Prod
      BUILD_CORES: "3"
      MIXAR_CUDA: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify native Intel toolchain
        run: |
          uname -m
          test "$(uname -m)" = "x86_64"
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          df -h /

      - name: Initialize Blender dependencies
        run: make init

      - name: Detect Intel Blender dependency support
        id: intel-support
        run: |
          if [ -d "upstream/lib/macos_x64/.git" ]; then
            echo "supported=true" >> "$GITHUB_OUTPUT"
            echo "Intel dependency bundle is available."
          else
            echo "supported=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Intel DMG build: Blender 5.x no longer ships upstream/lib/macos_x64 precompiled dependencies."
          fi

      - name: Check available disk
        if: steps.intel-support.outputs.supported == 'true'
        run: df -h /

      - name: Build Mixar
        if: steps.intel-support.outputs.supported == 'true'
        run: make build

      - name: Package macOS DMG
        if: steps.intel-support.outputs.supported == 'true'
        run: cmake --build build/Prod --target package --config Release

      - name: Inspect package
        if: steps.intel-support.outputs.supported == 'true'
        run: |
          find build/Prod -type f -name '*.dmg' -print
          df -h /

      - name: Upload Intel DMG
        if: steps.intel-support.outputs.supported == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mixar-Intel-macOS
          path: build/Prod/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Intel build skipped summary
        if: steps.intel-support.outputs.supported != 'true'
        run: |
          echo "Intel DMG build was skipped because upstream/lib/macos_x64 is unavailable for the pinned Blender version."
